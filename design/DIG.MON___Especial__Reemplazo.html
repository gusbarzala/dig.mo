  <script>
    (function () {
      var soundBtn = document.getElementById('sound-toggle');
      var soundIcon = document.getElementById('sound-icon');
      var muted = false;
      if (soundBtn && soundIcon) {
        soundBtn.addEventListener('click', function () {
          muted = !muted;
          soundIcon.textContent = muted ? 'volume_off' : 'volume_up';
        });
      }

      var statusEl = document.getElementById('swap-status');
      document.querySelectorAll('.swap-row').forEach(function (row) {
        var btn = row.querySelector('.swap-btn');
        var leftName = row.querySelector('.left-name');
        var rightName = row.querySelector('.right-name');
        var leftImg = row.querySelector('.left-img');
        var rightImg = row.querySelector('.right-img');

        btn.addEventListener('click', function () {
          var tmpName = leftName.textContent;
          leftName.textContent = rightName.textContent;
          rightName.textContent = tmpName;

          var tmpSrc = leftImg.src;
          leftImg.src = rightImg.src;
          rightImg.src = tmpSrc;

          var tmpAlt = leftImg.alt;
          leftImg.alt = rightImg.alt;
          rightImg.alt = tmpAlt;

          statusEl.textContent = '¡Reemplazo hecho! ' + leftName.textContent + ' ↔ ' + rightName.textContent + '.';
        });
      });
    })();
